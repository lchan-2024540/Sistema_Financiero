<div class="shell">
  <aside class="barra-lateral">
    <div class="marca">
      <span class="marca-icono">🏦</span>
      <div>
        <strong>Banco Académico</strong>
        <small>Sistema Bancario</small>
      </div>
    </div>

    <nav class="navegacion">
      @if (authService.esPersonal()) {
        <a routerLink="/clientes" routerLinkActive="activo">Clientes</a>
      }
      <a routerLink="/cuentas" routerLinkActive="activo">
        {{ authService.esPersonal() ? 'Cuentas' : 'Mis cuentas' }}
      </a>
      <a routerLink="/transferencias" routerLinkActive="activo">Transferencias</a>
    </nav>

    <div class="sesion">
      @if (authService.usuarioActual(); as usuario) {
        <div class="usuario-info">
          <span class="usuario-correo">{{ usuario.correo }}</span>
          <span class="usuario-rol">{{ usuario.rol }}</span>
        </div>
      }
      <button class="btn btn-secondary" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="contenido">
    <router-outlet></router-outlet>
  </main>
</div>
